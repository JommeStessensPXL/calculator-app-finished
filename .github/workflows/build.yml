name: Dependencies Example

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
    - name: Use node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20.x'
    - name: Install Dependencies
      run: npm ci
    - name: Zip 
      run: zip -r app.zip . -x "*.git"
    - run: ls -alhR